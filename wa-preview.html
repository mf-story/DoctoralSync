<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pratinjau Notifikasi WA — DoctoralSync</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: #0b141a; display: flex; justify-content: center; padding: 24px; }
  .phone { width: 420px; background: #0b141a; border-radius: 18px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5); border: 1px solid #1f2c34; }
  .bar { display: flex; align-items: center; gap: 10px; background: #202c33; padding: 12px 14px; color: #e9edef; }
  .bar .ava { width: 38px; height: 38px; border-radius: 50%; background: #0045a6; display: grid; place-items: center; font-size: 18px; }
  .bar .nm { font-weight: 600; font-size: 15px; }
  .bar .st { font-size: 12px; color: #8696a0; }
  .chat { background: #0b141a;
    background-image: url("https://static.whatsapp.net/rsrc.php/v3/yl/r/gi_DckOUM5a.png");
    background-size: 380px; padding: 16px 12px; min-height: 520px; }
  .msg { max-width: 88%; background: #202c33; color: #e9edef; border-radius: 10px;
    padding: 6px 6px 8px; margin-bottom: 14px; box-shadow: 0 1px 1px rgba(0,0,0,.3); }
  .msg img { width: 100%; border-radius: 7px; display: block; }
  .msg .cap { padding: 6px 6px 0; font-size: 14.5px; line-height: 1.45; white-space: pre-wrap; }
  .msg .cap b { color: #fff; }
  .msg .time { text-align: right; font-size: 11px; color: #8696a0; padding: 2px 4px 0; }
  .brand { color: #53bdeb; font-weight: 700; }
</style>
</head>
<body>
  <div class="phone">
    <div class="bar">
      <div class="ava">🎓</div>
      <div>
        <div class="nm">DoctoralSync</div>
        <div class="st">pesan otomatis</div>
      </div>
    </div>
    <div class="chat" id="chat"></div>
  </div>
<script>
  const IMG = "http://localhost:5520/notif-banner.jpg";
  const garis = "━━━━━━━━━━━━━━━";
  function tpl(nama, isi, catatan){
    let m = "Assalamualaikum Wr. Wb.\n\n*🎓 DOCTORALSYNC*\n_Sistem Bimbingan Disertasi_\n" + garis + "\n";
    m += "Yth. *" + nama + "*,\n\n" + isi;
    if (catatan) m += "\n\n📝 *Catatan:*\n" + catatan;
    m += "\n\n🔗 *Buka aplikasi:*\nhttp://localhost:5520\n" + garis + "\nTerima kasih 🙏\n_Wassalamualaikum Wr. Wb._";
    return m;
  }
  const msgs = [
    tpl("Dr. Andi Pratama, M.Kom.", `Terdapat *pengajuan bimbingan baru* dari *Budi Santoso* dengan topik _"Konsultasi Bab 1"_.\nMohon untuk ditindaklanjuti.`),
    tpl("Budi Santoso", `Terdapat *permintaan revisi* dari *Dr. Andi Pratama, M.Kom.* — _"Revisi Bab 2"_.`, `Perbaiki susunan latar belakang masalah dan tambahkan rujukan terbaru (5 tahun terakhir).`),
    tpl("Budi Santoso", `Alhamdulillah, bimbingan Anda telah *di-ACC* oleh *Dr. Andi Pratama, M.Kom.* dan dinyatakan *siap diujikan*. 🎉`, `Silakan mendaftar ujian ke prodi.`),
    tpl("Dr. Rina Kartika, M.Sc.", `*Budi Santoso* menambahkan *catatan* pada dokumen _"Bab 3 - Metodologi.pdf"_.`, `Mohon dicek bagian teknik analisis data, Bu.`)
  ];
  function fmt(t){
    return t
      .replace(/\*(.+?)\*/g, '<b>$1</b>')
      .replace(/_(.+?)_/g, '<i>$1</i>')
      .replace(/\n/g, '<br>');
  }
  const chat = document.getElementById('chat');
  msgs.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg';
    d.innerHTML = `<img src="${IMG}" alt="banner"><div class="cap">${fmt(m)}</div><div class="time">09.24 ✓✓</div>`;
    chat.appendChild(d);
  });
</script>
</body>
</html>
